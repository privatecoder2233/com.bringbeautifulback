<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bring Beautiful Back — Coming Soon</title>
  <meta name="description" content="Something beautiful is on its way. Bring Beautiful Back launches soon." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="grain" aria-hidden="true"></div>
  <div class="blob blob--one" aria-hidden="true"></div>
  <div class="blob blob--two" aria-hidden="true"></div>

  <main class="hero">
    <p class="eyebrow">Coming Soon</p>
    <h1 class="title">
      Bring<br /><em>Beautiful</em><br />Back.
    </h1>
    <p class="lead">Something beautiful is on its way.</p>
  </main>

  <footer class="foot">
    <span>© 2026 Bring Beautiful Back</span>
  </footer>

  <script>
    document.querySelectorAll('.hero > *').forEach((el, i) => {
      el.style.setProperty('--delay', `${i * 140}ms`);
      el.classList.add('is-in');
    });
  </script>
</body>
</html>
